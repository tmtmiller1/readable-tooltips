<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243042"/>
      <stop offset="100%" stop-color="#121821"/>
    </linearGradient>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7eed1"/>
      <stop offset="100%" stop-color="#e7d4a3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Gold frame to echo the in-game parchment/gold palette -->
  <rect x="26" y="26" width="972" height="972" rx="30" fill="none" stroke="#c9a24c" stroke-width="4" opacity="0.5"/>

  <!-- Mod logo: the 64-unit tooltip+cursor icon scaled up and vertically
       centered in the space between the top frame and the wordmark. -->
  <g transform="translate(192,52) scale(10)">
    <g stroke="#c9a24c" stroke-width="2" stroke-linejoin="round">
      <rect x="26" y="6" width="34" height="24" rx="3" fill="url(#parchment)"/>
      <path d="M31 30 L31 38 L39 30 Z" fill="url(#parchment)" stroke-linecap="round"/>
    </g>
    <g stroke="#b8933f" stroke-width="2.4" stroke-linecap="round">
      <line x1="31" y1="13" x2="55" y2="13"/>
      <line x1="31" y1="18.5" x2="55" y2="18.5"/>
      <line x1="31" y1="24" x2="48" y2="24"/>
    </g>
    <path d="M8 34 L8 58 L15 51 L20 60 L24 58 L19 49 L27 49 Z"
          fill="url(#parchment)" stroke="#c9a24c" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark: stacked on two lines so the long name stays well inside the frame -->
  <text x="512" y="812" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="96"
        font-weight="bold" fill="#e7d4a3" letter-spacing="3">READABLE</text>
  <text x="512" y="904" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="96"
        font-weight="bold" fill="#e7d4a3" letter-spacing="3">TOOL TIPS</text>
  <!-- Tagline -->
  <text x="512" y="958" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="34"
        fill="#c9a24c" opacity="0.92">Nudged clear of the cursor</text>
</svg>
